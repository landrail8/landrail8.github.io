{% assign section = locale.results %}
{% if section %}
<section class="section results-section">
  <h2 class="section-title">
    <span class="fa-stack fa-xs">
      <i class="fas fa-circle fa-stack-2x"></i>
      <i class="fas fa-trophy fa-stack-1x fa-inverse"></i>
    </span>
    {{ section.title }}
  </h2>

  <div class="cv-card-grid">
    {% for item in section.items %}
    <article class="cv-card result-card">
      <div class="result-metric">{{ item.metric }}</div>
      {% if item.before %}<div class="result-before">{{ item.before }}</div>{% endif %}
      <h3>{{ item.title }}</h3>
      <p>{{ item.details }}</p>
    </article>
    {% endfor %}
  </div>
</section>
{% endif %}
