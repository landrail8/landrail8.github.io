{% assign section = locale.career_path %}
{% if section %}
<section class="section career-path-section">
  <h2 class="section-title">
    <span class="fa-stack fa-xs">
      <i class="fas fa-circle fa-stack-2x"></i>
      <i class="fas fa-road fa-stack-1x fa-inverse"></i>
    </span>
    {{ section.title }}
  </h2>

  <p class="section-intro">{{ section.intro }}</p>
  <div class="career-timeline">
    {% for item in section.items %}
    <article class="career-step">
      <h3>{{ item.title }}</h3>
      <div class="career-focus">{{ item.focus }}</div>
      <p>{{ item.details }}</p>
    </article>
    {% endfor %}
  </div>
  <div class="industry-line">{{ section.industries }}</div>
</section>
{% endif %}
