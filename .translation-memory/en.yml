  value_proposition.title:
    source_hash: '078c9734a0390c178768c7a7cd8704c703f6bff8fc965f253d1a8ae43110e42d'
    source: Ценность для бизнеса
    translation: Business Value
    status: approved
  value_proposition.lead:
    source_hash: abd9c41a18f0993041ff82c212075fa771931e7e947131edf16ad34175c6ced5
    source: 'Более 20 лет занимаюсь автоматизацией бизнеса, из них более 10 лет — в роли руководителя ИТ-проектов. Прошёл путь от программиста до ИТ-директора, работал с компаниями в инженерии, производстве, строительстве, финансах, медиа и консалтинге.

      '
    translation: 'I have more than 20 years of experience in business automation, including over 10 years leading IT projects. I progressed from software developer to IT director and have worked with companies in engineering, manufacturing, construction, finance, media, and consulting.

      '
    status: approved
  value_proposition.summary:
    source_hash: 72fc9e00d2a12d288d5659a287288a96146c5f8d920261bbe9ef1542d8a44bfe
    source: |
      Сейчас отвечаю за цифровую трансформацию производственного холдинга: разрабатываю и внедряю ИТ-стратегию, формирую и контролирую ИТ-бюджет, одновременно веду несколько проектов с внутренними командами, подрядчиками и консультантами.

      Соединяю потребности бизнеса, изменения процессов и техническую реализацию — от описания требований до внедрения, обучения пользователей и сопровождения.
    translation: |
      I currently lead the digital transformation of a manufacturing holding company: developing and implementing its IT strategy, planning and controlling the IT budget, and managing several projects with internal teams, vendors, and consultants.

      I connect business needs, process change, and technical delivery — from requirements definition through implementation, user training, and ongoing support.
    status: approved
