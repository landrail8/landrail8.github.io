  transformation_cases.items[id=sales-warehouse].role:
    source_hash: cc544f50e28f152bba80d5c65c191612432c5f9990e8de213fcb250b5783bbc2
    source: Описание процесса, разработка технического задания, выбор и организация работы с подрядчиками, внедрение начиная с альфа-версии в реальный расчёт сделок, обучение пользователей.
    translation: Document the process, develop the technical specification, select and manage contractors, introduce the alpha version into live deal estimation, and train users.
    status: approved
  transformation_cases.items[id=sales-warehouse].solution:
    source_hash: 1b191b723c4a3384c48e110df73efd87d82456148e5586fa31b8efc2594d7565
