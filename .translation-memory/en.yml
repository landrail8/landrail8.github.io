    translation: Create a dedicated deal estimation workspace that makes maximum use of accumulated customer and supplier data.
    status: approved
  transformation_cases.items[id=sales-warehouse].result:
    source_hash: f5c7586355a2a2654d402b52b3ce39e10c3c61b2174b6f7785d723ff7ab538e8
    source: Создан механизм расчёта сделки, который позволяет автоматически расценивать до 80% позиций в запросе покупателя. Удобный интерфейс для расчёта всех строк сделки.
    translation: The resulting estimation engine automatically prices up to 80% of the line items in a customer request and provides a convenient interface for calculating every line in the deal.
    status: approved
