      effects:
        - Рост оборачиваемости товаров
        - Ускорение сборки заказов
        - Продажа складских остатков
    - id: data-model
      title: Единый контур данных
      metric: Управление на базе 1С ERP
      effect_title: Эффект
      effects:
        - Объединил данные по поставкам, складу, производству и продажам
        - Настроил ролевую модель, отчётность и BI-дашборды
        - Формирование KPI сотрудников по данным ERP-системы
    - id: ai
      title: AI-трансформация
      metric: ИИ в процессах
      effect_title: Эффект
      effects:
        - Протоколирование совещаний, анализ звонков менеджеров
        - Новый канал продаж через бота-нейропродавца
        - Корпоративная база знаний с чат-ботом

transformation_cases:
  title: Реализованные проекты
  items:
    - id: holding
      title: Цифровая трансформация производственного холдинга
      challenge: Перенести работу всех отделов в единую корпоративную систему учёта.
      role: Описание текущих бизнес-процессов, подбор ERP-системы, планирование и организация внедрения, подбор команды подрядчиков, обучение пользователей.
      solution: Внедрение 1С ERP как единой платформы, в которой работают все подразделения.
      result: Бизнес получил единый информационный контур и прозрачные показатели для управления операционной деятельностью.
    - id: sales-warehouse
      title: Рабочее место инженера по расчёту сделки
      challenge: Ускорить расчёт сделок, снизить зависимость от квалификации исполнителей.
      role: Описание процесса, разработка технического задания, выбор и организация работы с подрядчиками, внедрение начиная с альфа-версии в реальный расчёт сделок, обучение пользователей.
      solution: Создать рабочее место по расчёту сделок. Максимально использовать накопленную информацию по работе с клиентами и поставщиками при расчёте.
      result: Создан механизм расчёта сделки, который позволяет автоматически расценивать до 80% позиций в запросе покупателя. Удобный интерфейс для расчёта всех строк сделки.
    - id: crm-ai
      title: CRM и интеллектуальная автоматизация
      challenge: Сократить ручную работу с обращениями, встречами и документами.
      role: Поиск прикладных сценариев, проектирование процессов и внедрение инструментов.
      solution: Процессы в Битрикс24, Telegram-боты, квалификация лидов, протоколирование встреч и проверка договоров.
      result: Быстрее обрабатывается информация, а сотрудники работают по единым правилам.

management_scope:
  title: Управленческий контур
  intro: Отвечаю за связь стратегии, бизнес-процессов, команд и технологической реализации.
  items:
    - id: strategy
      title: Стратегия и бюджет
      details: Разработка и реализация ИТ-стратегии, формирование и контроль ИТ-бюджета.
    - id: portfolio
      title: Портфель проектов
      details: Приоритизация инициатив и управление несколькими параллельными проектами.
    - id: partnership
      title: Партнёрство с бизнесом
      details: Работа с руководителями подразделений, формирование требований и ожидаемых результатов.
    - id: teams
      title: Команды и подрядчики
      details: Координация внутренних специалистов, команд внедрения, поставщиков и консультантов.
    - id: change
      title: Внедрение изменений
      details: Описание процессов и ролей, обучение пользователей, контроль использования и сопровождение.
    - id: analytics
      title: Данные и KPI
      details: Управленческая отчётность, дашборды и показатели подразделений, сотрудников и проектов.

career_path:
