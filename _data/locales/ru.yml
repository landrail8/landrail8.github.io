value_proposition:
  title: Ценность для бизнеса
  lead: |
    Более 20 лет занимаюсь автоматизацией бизнеса, из них более 10 лет — в роли руководителя ИТ-проектов. Прошёл путь от программиста до ИТ-директора, работал с компаниями в инженерии, производстве, строительстве, финансах, медиа и консалтинге.
  summary: |
    Сейчас отвечаю за цифровую трансформацию производственного холдинга: разрабатываю и внедряю ИТ-стратегию, формирую и контролирую ИТ-бюджет, одновременно веду несколько проектов с внутренними командами, подрядчиками и консультантами.

    Соединяю потребности бизнеса, изменения процессов и техническую реализацию — от описания требований до внедрения, обучения пользователей и сопровождения.
  stats:
    - id: automation
      value: 20+
      label: лет в автоматизации бизнеса
    - id: leadership
      value: 10+
      label: лет управления ИТ-проектами
    - id: career
      value: Программист → ИТ-директор
      label: профессиональный путь

business_value:
  title: Как создаю ценность
  items:
    - id: diagnose
      icon: search
      title: Нахожу точки потерь
      details: Анализирую процессы, данные и ограничения. Выявляю ручные операции, разрывы между подразделениями и причины управленческой непрозрачности.
    - id: design
      icon: lightbulb
      title: Проектирую решение
      details: Перевожу бизнес-цели в требования, показатели и портфель ИТ-инициатив. Определяю приоритеты, роли, процессы и ожидаемый результат.
    - id: deliver
      icon: tasks
      title: Довожу до внедрения
      details: Координирую внутренние команды, подрядчиков и консультантов. Веду проект от постановки задачи до запуска, обучения пользователей и сопровождения.
    - id: manage
      icon: chart-line
      title: Создаю инструменты управления
      details: Формирую KPI подразделений и сотрудников, управленческую отчётность и дашборды. Даю руководителям данные для принятия решений.

results:
  title: Ключевые результаты
  items:
    - id: proposal
      metric: 15 минут
      before: "Было: 4 часа — 1 день"
      title: Подготовка коммерческого предложения
      details: Внедрил адресный склад и изменил процесс работы с остатками и аналогами товаров.
    - id: order-import
      metric: Excel → ERP
      title: Самостоятельная загрузка клиентских заявок
      details: Автоматизировал сопоставление номенклатуры и перенос расчёта сделки в заказ. Менеджеры выполняют операцию без участия отдельного сотрудника.
    - id: data-model
      metric: Единый контур данных
      title: Управление на базе 1С ERP
      details: Объединил данные по поставкам, складу, производству и продажам. Настроил ролевую модель, отчётность и дашборды.
    - id: ai
      metric: ИИ в процессах
      title: Автоматизация работы с информацией
      details: Внедрял протоколирование совещаний, Telegram-бота для ответов клиентам и квалификации лидов, анализ договоров по заданным критериям.

transformation_cases:
  title: Проекты трансформации
  items:
    - id: holding
      title: Цифровая трансформация производственного холдинга
      challenge: Связать бизнес-цели, процессы подразделений и разрозненные ИТ-инициативы.
      role: ИТ-стратегия, бюджет, портфель проектов, требования, координация команд внедрения и консультантов.
      solution: 1С ERP, единая модель данных, описание процессов и ролей, управленческая отчётность, KPI и проектная аналитика.
      result: Бизнес получает единый информационный контур и прозрачные показатели для управления операционной деятельностью.
    - id: sales-warehouse
      title: Автоматизация продаж и складских операций
      challenge: Ускорить расчёт сделок и повысить прозрачность остатков.
      role: Анализ процесса, постановка требований, координация реализации и внедрение нового порядка работы.
      solution: Адресный склад, работа с аналогами, импорт клиентских заявок и автоматическое сопоставление номенклатуры.
      result: Время подготовки коммерческого предложения сократилось с 4 часов — 1 дня до 15 минут.
    - id: crm-ai
      title: CRM и интеллектуальная автоматизация
      challenge: Сократить ручную работу с обращениями, встречами и документами.
      role: Поиск прикладных сценариев, проектирование процессов и внедрение инструментов.
      solution: Процессы в Битрикс24, Telegram-боты, квалификация лидов, протоколирование встреч и проверка договоров.
      result: Быстрее обрабатывается информация, а сотрудники работают по единым правилам.

management_scope:
  title: Управленческий контур
  intro: Отвечаю за связь стратегии, бизнес-процессов, команд и технологической реализации.
  items:
    - id: strategy
      title: Стратегия и бюджет
      details: Разработка и реализация ИТ-стратегии, формирование и контроль ИТ-бюджета.
    - id: portfolio
      title: Портфель проектов
      details: Приоритизация инициатив и управление несколькими параллельными проектами.
    - id: partnership
      title: Партнёрство с бизнесом
      details: Работа с руководителями подразделений, формирование требований и ожидаемых результатов.
    - id: teams
      title: Команды и подрядчики
      details: Координация внутренних специалистов, команд внедрения, поставщиков и консультантов.
    - id: change
      title: Внедрение изменений
      details: Описание процессов и ролей, обучение пользователей, контроль использования и сопровождение.
    - id: analytics
      title: Данные и KPI
      details: Управленческая отчётность, дашборды и показатели подразделений, сотрудников и проектов.

career_path:
  title: Карьерный путь
  intro: Технический опыт позволяет оценивать реализуемость решений, а управленческий — доводить их до практического использования.
  items:
    - id: it-director
      title: ИТ-директор и ИТ-бизнес-партнёр
      focus: Цифровая трансформация производственного бизнеса
      details: ИТ-стратегия, бюджет, портфель инициатив, архитектура процессов и управленческая аналитика.
    - id: project-lead
      title: Руководитель проектов автоматизации
      focus: Более 10 лет управления ИТ-проектами
      details: ERP, CRM, интеграции, отчётность, управление командами и изменениями.
    - id: developer
      title: Разработчик и архитектор решений
      focus: Практическая техническая база
      details: Проектирование и разработка бизнес-систем, интеграций и пользовательских интерфейсов.
  industries: Инженерия · Производство · Строительство · Финансы · Медиа · Консалтинг

