value_proposition:
  title: Профессиональный профиль
  lead: |
    Более 20 лет занимаюсь автоматизацией бизнеса, из них более 10 лет — в роли руководителя ИТ-проектов. Прошёл путь от программиста до ИТ-директора, работал с компаниями в инженерии, производстве, строительстве, финансах, медиа и консалтинге.
  summary: |
    Сейчас отвечаю за цифровую трансформацию производственного холдинга: разрабатываю и внедряю ИТ-стратегию, формирую и контролирую ИТ-бюджет, одновременно веду несколько проектов с внутренними командами, подрядчиками и консультантами.

    Соединяю потребности бизнеса, изменения процессов и техническую реализацию — от описания требований до внедрения, обучения пользователей и сопровождения.
  stats:
    - id: automation
      value: 20+
      label: лет в автоматизации бизнеса
    - id: leadership
      value: 10+
      label: лет управления ИТ-проектами
    - id: career
      value: Программист → ИТ-директор
      label: профессиональный путь

business_value:
  title: Как создаю ценность
  items:
    - id: diagnose
      icon: search
      title: Нахожу точки потерь
      details: Анализирую процессы, данные и ограничения. Выявляю ручные операции, разрывы между подразделениями и причины управленческой непрозрачности.
    - id: design
      icon: lightbulb
      title: Проектирую решение
      details: Перевожу бизнес-цели в требования, показатели и портфель ИТ-инициатив. Определяю приоритеты, роли, процессы и ожидаемый результат.
    - id: deliver
      icon: tasks
      title: Довожу до внедрения
      details: Координирую внутренние команды, подрядчиков и консультантов. Веду проект от постановки задачи до запуска, обучения пользователей и сопровождения.
    - id: manage
      icon: chart-line
      title: Создаю инструменты управления
      details: Формирую KPI подразделений и сотрудников, управленческую отчётность и дашборды. Даю руководителям данные для принятия решений.

