  intro: Технический опыт позволяет оценивать реализуемость решений, а управленческий — доводить их до практического использования.
  items:
    - id: it-director
      title: ИТ-директор и ИТ-бизнес-партнёр
      focus: Цифровая трансформация производственного бизнеса
      details: ИТ-стратегия, бюджет, портфель инициатив, архитектура процессов и управленческая аналитика.
    - id: project-lead
      title: Руководитель проектов автоматизации
      focus: Более 10 лет управления ИТ-проектами
      details: ERP, CRM, интеграции, отчётность, управление командами и изменениями.
    - id: developer
      title: Разработчик и архитектор решений
      focus: Практическая техническая база
      details: Проектирование и разработка бизнес-систем, интеграций и пользовательских интерфейсов.
